<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen Writing</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#060C15;
    --panel:#0C1626;
    --panel-border:#1A2739;
    --paper:#F6F4EC;
    --paper-edge:#E5E1D2;
    --ink:#20232B;
    --accent:#6FA0C7;
    --accent-strong:#89B7DA;
    --accent-ink:#0E1826;
    --muted:#7E93A8;
    --muted-dim:#48586B;
    --danger:#C07E72;
    --shell-text:#E4ECF3;
  }
  [data-theme="light"]{
    --bg:#EAF1F7;
    --panel:#DCE7F1;
    --panel-border:#C2D3E1;
    --paper:#FFFFFF;
    --paper-edge:#E7ECF1;
    --ink:#1E2A38;
    --accent:#2F5C86;
    --accent-strong:#3E729E;
    --accent-ink:#FFFFFF;
    --muted:#5A6B7C;
    --muted-dim:#8A98A6;
    --danger:#A6493C;
    --shell-text:#1E2A38;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--shell-text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex;
    height:100vh;
    overflow:hidden;
    transition:background .2s, color .2s;
  }

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:250px;
    min-width:250px;
    background:var(--panel);
    border-right:1px solid var(--panel-border);
    display:flex;
    flex-direction:column;
    padding:22px 16px;
    transition:background .2s, border-color .2s;
  }
  #brand-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
  }
  #brand{
    font-size:17px;
    font-weight:700;
    letter-spacing:0.01em;
    color:var(--shell-text);
    margin:0;
  }
  #theme-toggle{
    background:transparent;
    border:1px solid var(--panel-border);
    color:var(--muted);
    padding:5px 11px;
    border-radius:4px;
    cursor:pointer;
    font-size:11.5px;
    font-family:inherit;
  }
  #theme-toggle:hover{border-color:var(--accent); color:var(--accent);}
  #new-script-btn{
    background:transparent;
    border:1px solid var(--accent);
    color:var(--accent);
    padding:9px 12px;
    border-radius:4px;
    font-size:13px;
    cursor:pointer;
    text-align:left;
    transition:background .15s, color .15s;
  }
  #new-script-btn:hover{
    background:var(--accent);
    color:var(--accent-ink);
  }
  #script-list{
    margin-top:18px;
    overflow-y:auto;
    flex:1;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .script-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    padding:9px 8px;
    border-radius:4px;
    cursor:pointer;
    color:var(--muted);
  }
  .script-item:hover{background:var(--panel-border);}
  .script-item.active{
    background:var(--panel-border);
    color:var(--shell-text);
    box-shadow:inset 2px 0 0 var(--accent);
  }
  .script-item .meta{overflow:hidden;}
  .script-item .name{
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .script-item .time{
    font-size:10.5px;
    color:var(--muted-dim);
    margin-top:1px;
  }
  .script-item .del{
    background:none;
    border:none;
    color:var(--muted-dim);
    cursor:pointer;
    font-size:13px;
    padding:2px 4px;
    visibility:hidden;
    border-radius:3px;
  }
  .script-item:hover .del{visibility:visible;}
  .script-item .del:hover{color:var(--danger);}
  #sidebar-empty{
    color:var(--muted-dim);
    font-size:12.5px;
    padding:8px;
    line-height:1.5;
  }

  /* ---------- Main ---------- */
  #main{
    flex:1;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  #topbar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 28px;
    border-bottom:1px solid var(--panel-border);
    background:var(--panel);
  }
  #topbar input{
    background:transparent;
    border:none;
    border-bottom:1px solid transparent;
    color:var(--shell-text);
    font-size:14px;
    padding:4px 2px;
    font-family:inherit;
  }
  #topbar input:focus{
    outline:none;
    border-bottom:1px solid var(--accent);
  }
  #title-input{font-weight:600; width:260px;}
  #author-input{color:var(--muted); width:200px;}
  #save-indicator{
    font-size:11px;
    color:var(--muted-dim);
    margin-left:auto;
    min-width:70px;
  }
  #export-btn{
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    padding:9px 16px;
    border-radius:4px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  #export-btn:hover{background:var(--accent-strong);}
  #export-btn:disabled{background:var(--panel-border); color:var(--muted-dim); cursor:not-allowed;}

  #toolbar-wrap{
    background:var(--bg);
    padding:12px 0 6px;
  }
  #toolbar{
    display:flex;
    justify-content:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .type-btn{
    background:transparent;
    border:1px solid var(--panel-border);
    color:var(--muted);
    padding:6px 12px;
    border-radius:4px;
    font-size:12px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    line-height:1.3;
  }
  .type-btn kbd{
    font-size:9.5px;
    color:var(--muted-dim);
    background:var(--panel-border);
    padding:1px 5px;
    border-radius:3px;
    font-family:inherit;
  }
  .type-btn:hover{border-color:var(--accent); color:var(--shell-text);}
  .type-btn.active{
    border-color:var(--accent);
    color:var(--accent-strong);
    background:var(--panel);
  }
  .type-btn.active kbd{color:var(--accent-strong);}

  #stage{
    flex:1;
    overflow-y:auto;
    display:flex;
    justify-content:center;
    padding:36px 20px 80px;
  }
  #empty-state{
    margin:auto;
    text-align:center;
    color:var(--muted-dim);
    max-width:320px;
  }
  #empty-state h2{
    color:var(--muted);
    font-weight:600;
    font-size:19px;
  }
  #continue-btn{
    margin-top:14px;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    padding:9px 18px;
    border-radius:4px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    display:inline-block;
  }
  #empty-new-btn{
    margin-top:10px;
    background:transparent;
    color:var(--muted);
    border:1px solid var(--panel-border);
    padding:9px 18px;
    border-radius:4px;
    font-size:13px;
    cursor:pointer;
    display:inline-block;
  }
  #empty-new-btn:hover{border-color:var(--accent); color:var(--shell-text);}

  #page{
    width:720px;
    max-width:100%;
    background:var(--paper);
    color:var(--ink);
    box-shadow:0 20px 45px rgba(0,0,0,.35);
    border-radius:2px;
    padding:60px 68px 90px 96px;
    position:relative;
    font-family:"Courier New",Courier,monospace;
    font-size:14.5px;
    line-height:1.65;
    min-height:900px;
  }
  #page::before, #page::after{
    content:"";
    position:absolute;
    left:34px;
    width:13px;
    height:13px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, var(--paper-edge), #B7AF97 70%);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.3);
  }
  #page::before{top:56px;}
  #page::after{top:130px;}

  .block{
    outline:none;
    white-space:pre-wrap;
    word-wrap:break-word;
    min-height:1.65em;
    margin:0;
  }
  .block:empty:before{
    content:attr(data-placeholder);
    color:#B0AA98;
  }
  .block:focus{
    background:rgba(111,160,199,0.12);
  }
  .type-scene_heading{
    text-transform:uppercase;
    font-weight:700;
    margin-top:1.2em;
  }
  .type-action{margin-top:0.4em;}
  .type-character{
    text-transform:uppercase;
    margin-left:2.3in;
    margin-top:1em;
    max-width:2.6in;
  }
  .type-parenthetical{
    margin-left:1.7in;
    max-width:2in;
    color:#57534A;
  }
  .type-dialogue{
    margin-left:1in;
    max-width:3.5in;
  }
  .type-transition{
    text-transform:uppercase;
    text-align:right;
    margin-top:1em;
  }
  .block:first-child{margin-top:0;}

  #sidebar::-webkit-scrollbar, #stage::-webkit-scrollbar{width:9px;}
  #sidebar::-webkit-scrollbar-thumb, #stage::-webkit-scrollbar-thumb{
    background:var(--panel-border); border-radius:5px;
  }

  @media (max-width:720px){
    #page{padding:40px 24px 60px 48px;}
    .type-character{margin-left:1.2in;}
    .type-dialogue{margin-left:0.5in; max-width:none;}
    .type-parenthetical{margin-left:0.9in;}
  }
</style>
</head>
<body>

  <div id="sidebar">
    <div id="brand-row">
      <p id="brand">Screen Writing</p>
      <button id="theme-toggle">Light</button>
    </div>
    <button id="new-script-btn">+ New script</button>
    <div id="script-list"></div>
  </div>

  <div id="main">
    <div id="topbar" style="display:none;">
      <input id="title-input" placeholder="Untitled Script" spellcheck="false">
      <input id="author-input" placeholder="Author name" spellcheck="false">
      <span id="save-indicator"></span>
      <button id="export-btn">Export PDF</button>
    </div>
    <div id="toolbar-wrap" style="display:none;">
      <div id="toolbar"></div>
    </div>
    <div id="stage">
      <div id="empty-state">
        <h2>No page open</h2>
        <button id="continue-btn" style="display:none;">Continue</button>
        <button id="empty-new-btn">+ New script</button>
      </div>
      <div id="page" style="display:none;"></div>
    </div>
  </div>

<script>
(function(){

  var TYPES = [
    {key:'scene_heading', label:'Location',     shortcut:'1', placeholder:'Where does this happen?'},
    {key:'action',        label:'Action',       shortcut:'2', placeholder:'What happens here?'},
    {key:'character',     label:'Speaker',      shortcut:'3', placeholder:'Who is talking?'},
    {key:'parenthetical', label:'Note',         shortcut:'4', placeholder:'How they say it'},
    {key:'dialogue',      label:'Dialogue',     shortcut:'5', placeholder:'What they say'},
    {key:'transition',    label:'Scene change', shortcut:'6', placeholder:'How you move to the next scene'}
  ];
  var TYPE_MAP = {};
  TYPES.forEach(function(t){ TYPE_MAP[t.key] = t; });

  var NEXT_TYPE = {
    scene_heading: 'action',
    action: 'action',
    character: 'dialogue',
    parenthetical: 'dialogue',
    dialogue: 'character',
    transition: 'scene_heading'
  };

  var pageEl = document.getElementById('page');
  var stageEl = document.getElementById('stage');
  var emptyStateEl = document.getElementById('empty-state');
  var topbarEl = document.getElementById('topbar');
  var toolbarWrapEl = document.getElementById('toolbar-wrap');
  var toolbarEl = document.getElementById('toolbar');
  var titleInput = document.getElementById('title-input');
  var authorInput = document.getElementById('author-input');
  var saveIndicator = document.getElementById('save-indicator');
  var exportBtn = document.getElementById('export-btn');
  var listEl = document.getElementById('script-list');
  var newBtn = document.getElementById('new-script-btn');
  var emptyNewBtn = document.getElementById('empty-new-btn');
  var continueBtn = document.getElementById('continue-btn');
  var themeToggle = document.getElementById('theme-toggle');

  var current = null;      // {id, title, author, blocks:[{id,type,text}], updatedAt}
  var focusedId = null;
  var saveTimer = null;
  var idCounter = 0;

  function genId(){
    idCounter++;
    return 'b' + Date.now().toString(36) + idCounter;
  }

  /* ---------------- Storage (plain browser localStorage) ---------------- */

  var NS = 'screenwriting:';
  var storage = {
    get: function(key){
      return new Promise(function(resolve, reject){
        var raw;
        try { raw = localStorage.getItem(NS + key); } catch(e){ raw = null; }
        if(raw === null){ reject(new Error('not found')); return; }
        resolve({key: key, value: raw});
      });
    },
    set: function(key, value){
      return new Promise(function(resolve, reject){
        try {
          localStorage.setItem(NS + key, value);
          resolve({key: key, value: value});
        } catch(e){ reject(e); }
      });
    },
    delete: function(key){
      return new Promise(function(resolve){
        try { localStorage.removeItem(NS + key); } catch(e){}
        resolve({key: key, deleted: true});
      });
    },
    list: function(prefix){
      return new Promise(function(resolve){
        var keys = [];
        try {
          for(var i=0;i<localStorage.length;i++){
            var k = localStorage.key(i);
            if(k.indexOf(NS) === 0){
              var stripped = k.slice(NS.length);
              if(!prefix || stripped.indexOf(prefix) === 0) keys.push(stripped);
            }
          }
        } catch(e){}
        resolve({keys: keys});
      });
    }
  };

  /* ---------------- Theme ---------------- */

  function applyTheme(theme){
    if(theme === 'light'){
      document.body.setAttribute('data-theme','light');
      themeToggle.textContent = 'Dark';
    } else {
      document.body.removeAttribute('data-theme');
      themeToggle.textContent = 'Light';
    }
  }

  function toggleTheme(){
    var isLight = document.body.getAttribute('data-theme') === 'light';
    var next = isLight ? 'dark' : 'light';
    applyTheme(next);
    storage.set('ui:theme', next, false).catch(function(){});
  }

  themeToggle.addEventListener('click', toggleTheme);

  storage.get('ui:theme').then(function(res){
    if(res && res.value) applyTheme(res.value);
  }).catch(function(){});

  /* ---------------- Toolbar ---------------- */

  function buildToolbar(){
    toolbarEl.innerHTML = '';
    TYPES.forEach(function(t){
      var btn = document.createElement('button');
      btn.className = 'type-btn';
      btn.dataset.type = t.key;
      btn.innerHTML = t.label + '<kbd>Ctrl+' + t.shortcut + '</kbd>';
      btn.addEventListener('click', function(){
        if(focusedId) setBlockType(focusedId, t.key, true);
      });
      toolbarEl.appendChild(btn);
    });
  }
  buildToolbar();

  function highlightToolbar(type){
    var btns = toolbarEl.querySelectorAll('.type-btn');
    for(var i=0;i<btns.length;i++){
      btns[i].classList.toggle('active', btns[i].dataset.type === type);
    }
  }

  /* ---------------- Rendering ---------------- */

  function renderPage(){
    pageEl.innerHTML = '';
    current.blocks.forEach(function(block){
      pageEl.appendChild(makeBlockEl(block));
    });
  }

  function makeBlockEl(block){
    var el = document.createElement('div');
    el.className = 'block type-' + block.type;
    el.contentEditable = 'true';
    el.spellcheck = false;
    el.dataset.id = block.id;
    el.dataset.type = block.type;
    el.dataset.placeholder = TYPE_MAP[block.type].placeholder;
    el.textContent = block.text || '';
    attachBlockEvents(el);
    return el;
  }

  function attachBlockEvents(el){
    el.addEventListener('focus', function(){
      focusedId = el.dataset.id;
      highlightToolbar(el.dataset.type);
    });
    el.addEventListener('input', function(){
      scheduleSave();
    });
    el.addEventListener('keydown', onBlockKeydown);
  }

  function focusBlock(id, atStart){
    var el = pageEl.querySelector('[data-id="' + id + '"]');
    if(!el) return;
    el.focus();
    placeCaret(el, atStart);
  }

  function placeCaret(el, atStart){
    var range = document.createRange();
    var sel = window.getSelection();
    if(!el.firstChild){
      range.setStart(el, 0);
    } else if(atStart){
      range.setStart(el.firstChild, 0);
    } else {
      range.selectNodeContents(el);
      range.collapse(false);
    }
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function splitAtCaret(el){
    var sel = window.getSelection();
    var full = el.textContent;
    if(!sel.rangeCount) return [full, ''];
    var range = sel.getRangeAt(0);
    var pre = range.cloneRange();
    pre.selectNodeContents(el);
    pre.setEnd(range.endContainer, range.endOffset);
    var before = pre.toString();
    var after = full.slice(before.length);
    return [before, after];
  }

  function caretOffset(el){
    var sel = window.getSelection();
    if(!sel.rangeCount) return 0;
    var range = sel.getRangeAt(0);
    var pre = range.cloneRange();
    pre.selectNodeContents(el);
    pre.setEnd(range.endContainer, range.endOffset);
    return pre.toString().length;
  }

  function onBlockKeydown(e){
    var el = e.currentTarget;
    var id = el.dataset.id;
    var idx = blockIndex(id);

    if(e.ctrlKey && /^[1-6]$/.test(e.key)){
      e.preventDefault();
      setBlockType(id, TYPES[parseInt(e.key,10)-1].key, false);
      return;
    }

    if(e.key === 'Tab'){
      e.preventDefault();
      var curTypeIdx = TYPES.findIndex(function(t){return t.key === el.dataset.type;});
      var dir = e.shiftKey ? -1 : 1;
      var nextIdx = (curTypeIdx + dir + TYPES.length) % TYPES.length;
      setBlockType(id, TYPES[nextIdx].key, false);
      return;
    }

    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      var parts = splitAtCaret(el);
      var before = parts[0], after = parts[1];
      el.textContent = before;
      var newType = NEXT_TYPE[el.dataset.type] || 'action';
      var newBlock = {id: genId(), type: newType, text: after};
      current.blocks.splice(idx+1, 0, newBlock);
      pageEl.insertBefore(makeBlockEl(newBlock), el.nextSibling);
      focusBlock(newBlock.id, true);
      scheduleSave();
      return;
    }

    if(e.key === 'Backspace'){
      var offset = caretOffset(el);
      var selCollapsed = window.getSelection().isCollapsed;
      if(offset === 0 && selCollapsed && idx > 0){
        e.preventDefault();
        var prevBlock = current.blocks[idx-1];
        var prevEl = pageEl.querySelector('[data-id="' + prevBlock.id + '"]');
        var mergedTail = el.textContent;
        var prevLen = prevEl.textContent.length;
        prevEl.textContent = prevEl.textContent + mergedTail;
        current.blocks.splice(idx, 1);
        pageEl.removeChild(el);
        prevEl.focus();
        var range = document.createRange();
        var sel = window.getSelection();
        if(prevEl.firstChild){
          range.setStart(prevEl.firstChild, Math.min(prevLen, prevEl.firstChild.length));
        } else {
          range.setStart(prevEl, 0);
        }
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
        scheduleSave();
      }
      return;
    }

    if(e.key === 'ArrowUp'){
      var off = caretOffset(el);
      if(off === 0 && idx > 0){
        e.preventDefault();
        focusBlock(current.blocks[idx-1].id, false);
      }
      return;
    }
    if(e.key === 'ArrowDown'){
      var off2 = caretOffset(el);
      if(off2 === el.textContent.length && idx < current.blocks.length - 1){
        e.preventDefault();
        focusBlock(current.blocks[idx+1].id, true);
      }
      return;
    }
  }

  function blockIndex(id){
    for(var i=0;i<current.blocks.length;i++){
      if(current.blocks[i].id === id) return i;
    }
    return -1;
  }

  function setBlockType(id, type, refocus){
    var idx = blockIndex(id);
    if(idx === -1) return;
    current.blocks[idx].type = type;
    var el = pageEl.querySelector('[data-id="' + id + '"]');
    if(el){
      el.className = 'block type-' + type;
      el.dataset.type = type;
      el.dataset.placeholder = TYPE_MAP[type].placeholder;
      if(refocus) el.focus();
    }
    highlightToolbar(type);
    scheduleSave();
  }

  /* ---------------- Model <-> DOM ---------------- */

  function syncBlocksFromDOM(){
    var els = pageEl.querySelectorAll('.block');
    var byId = {};
    els.forEach(function(el){
      byId[el.dataset.id] = el.textContent;
    });
    current.blocks.forEach(function(b){
      if(byId.hasOwnProperty(b.id)) b.text = byId[b.id];
    });
  }

  /* ---------------- Persistence ---------------- */

  function scheduleSave(){
    saveIndicator.textContent = 'Editing…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(performSave, 700);
  }

  function performSave(){
    if(!current) return;
    syncBlocksFromDOM();
    current.title = titleInput.value.trim() || 'Untitled Script';
    current.author = authorInput.value.trim();
    current.updatedAt = Date.now();
    storage.set('script:' + current.id, JSON.stringify(current), false)
      .then(function(){
        saveIndicator.textContent = 'Saved';
        renderList();
      })
      .catch(function(){
        saveIndicator.textContent = 'Could not save';
      });
  }

  function newScript(){
    var id = 'id' + Date.now().toString(36);
    var blocks = [
      {id: genId(), type: 'scene_heading', text: ''},
      {id: genId(), type: 'action', text: ''}
    ];
    current = {id: id, title: 'Untitled Script', author: '', blocks: blocks, updatedAt: Date.now()};
    openCurrent();
    storage.set('script:' + id, JSON.stringify(current), false).then(renderList);
  }

  function openCurrent(){
    emptyStateEl.style.display = 'none';
    pageEl.style.display = 'block';
    topbarEl.style.display = 'flex';
    toolbarWrapEl.style.display = 'block';
    titleInput.value = current.title === 'Untitled Script' ? '' : current.title;
    authorInput.value = current.author || '';
    exportBtn.disabled = false;
    saveIndicator.textContent = '';
    renderPage();
    var first = current.blocks[0];
    focusBlock(first.id, true);
    renderList();
  }

  function loadScript(id){
    if(current) performSave();
    storage.get('script:' + id).then(function(res){
      if(!res) return;
      current = JSON.parse(res.value);
      openCurrent();
    }).catch(function(){});
  }

  function deleteScript(id, ev){
    ev.stopPropagation();
    if(!confirm('Delete this script? This cannot be undone.')) return;
    storage.delete('script:' + id, false).then(function(){
      if(current && current.id === id){
        current = null;
        pageEl.style.display = 'none';
        topbarEl.style.display = 'none';
        toolbarWrapEl.style.display = 'none';
        emptyStateEl.style.display = 'block';
        exportBtn.disabled = true;
      }
      renderList();
    }).catch(function(){});
  }

  function timeAgo(ts){
    var diff = Date.now() - ts;
    var mins = Math.round(diff/60000);
    if(mins < 1) return 'just now';
    if(mins < 60) return mins + 'm ago';
    var hrs = Math.round(mins/60);
    if(hrs < 24) return hrs + 'h ago';
    var days = Math.round(hrs/24);
    return days + 'd ago';
  }

  function getAllScripts(){
    return storage.list('script:').then(function(res){
      var keys = (res && res.keys) || [];
      var gets = keys.map(function(k){
        return storage.get(k).then(function(r){
          try { return JSON.parse(r.value); } catch(e){ return null; }
        }).catch(function(){ return null; });
      });
      return Promise.all(gets).then(function(list){
        return list.filter(Boolean).sort(function(a,b){ return b.updatedAt - a.updatedAt; });
      });
    }).catch(function(){ return []; });
  }

  function updateContinueButton(scripts){
    if(current){ continueBtn.style.display = 'none'; return; }
    if(scripts.length > 0){
      continueBtn.style.display = 'inline-block';
      continueBtn.dataset.id = scripts[0].id;
    } else {
      continueBtn.style.display = 'none';
    }
  }

  function renderList(){
    getAllScripts().then(function(scripts){
      updateContinueButton(scripts);
      if(scripts.length === 0){
        listEl.innerHTML = '<div id="sidebar-empty">No scripts yet. Your first page is one click away.</div>';
        return;
      }
      listEl.innerHTML = '';
      scripts.forEach(function(s){
        var item = document.createElement('div');
        item.className = 'script-item' + (current && current.id === s.id ? ' active' : '');
        item.innerHTML =
          '<div class="meta">' +
            '<div class="name">' + escapeHtml(s.title || 'Untitled Script') + '</div>' +
            '<div class="time">' + timeAgo(s.updatedAt || Date.now()) + '</div>' +
          '</div>' +
          '<button class="del" title="Delete">✕</button>';
        item.addEventListener('click', function(){ loadScript(s.id); });
        item.querySelector('.del').addEventListener('click', function(ev){ deleteScript(s.id, ev); });
        listEl.appendChild(item);
      });
    });
  }

  function escapeHtml(str){
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  /* ---------------- PDF export ---------------- */

  function exportPDF(){
    if(!current) return;
    syncBlocksFromDOM();
    var title = (titleInput.value.trim() || 'Untitled Script');
    var author = authorInput.value.trim();

    if(typeof window.jspdf === 'undefined'){
      alert('The PDF engine is still loading — give it a second and try again.');
      return;
    }
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({unit:'in', format:'letter'});

    var pageW = 8.5, pageH = 11;
    var leftMargin = 1.5, rightMargin = 1, topMargin = 1, bottomMargin = 1;
    var textWidth = pageW - leftMargin - rightMargin;
    var lineHeight = 1/6;

    doc.setFont('courier','normal');
    doc.setFontSize(12);

    doc.text(title.toUpperCase(), pageW/2, 3.8, {align:'center'});
    if(author){
      doc.text('by', pageW/2, 3.8 + lineHeight*4, {align:'center'});
      doc.text(author, pageW/2, 3.8 + lineHeight*6, {align:'center'});
    }

    doc.addPage();
    var y = topMargin;
    var pageNum = 1;

    function newPage(){
      doc.addPage();
      pageNum++;
      y = topMargin;
      doc.setFontSize(12);
      doc.text(String(pageNum) + '.', pageW - rightMargin, 0.6, {align:'right'});
    }

    function ensureSpace(lines){
      if(y + lines*lineHeight > pageH - bottomMargin){
        newPage();
      }
    }

    current.blocks.forEach(function(block){
      var text = (block.text || '').trim();
      if(!text) return;
      var indent = 0, width = textWidth, display = text, extraBefore = 0, extraAfter = lineHeight;

      switch(block.type){
        case 'scene_heading':
          display = text.toUpperCase();
          extraBefore = lineHeight;
          break;
        case 'action':
          extraAfter = lineHeight;
          break;
        case 'character':
          indent = 2.2; width = 3.0; display = text.toUpperCase();
          extraBefore = lineHeight; extraAfter = 0;
          break;
        case 'parenthetical':
          indent = 1.6; width = 2.0;
          display = '(' + text.replace(/^\(|\)$/g,'') + ')';
          extraAfter = 0;
          break;
        case 'dialogue':
          indent = 1.0; width = 3.5;
          break;
        case 'transition':
          indent = 4.0; width = 2.5;
          display = text.toUpperCase();
          extraBefore = lineHeight;
          break;
      }

      if(extraBefore) { ensureSpace(1); y += extraBefore; }

      var lines = doc.splitTextToSize(display, width);
      lines.forEach(function(line){
        ensureSpace(1);
        doc.text(line, leftMargin + indent, y);
        y += lineHeight;
      });
      y += extraAfter;
    });

    doc.save(title.replace(/[^a-z0-9\-_ ]/gi,'').trim() + '.pdf');
  }

  /* ---------------- Wiring ---------------- */

  newBtn.addEventListener('click', newScript);
  emptyNewBtn.addEventListener('click', newScript);
  continueBtn.addEventListener('click', function(){
    var id = continueBtn.dataset.id;
    if(id) loadScript(id);
  });
  exportBtn.addEventListener('click', exportPDF);
  titleInput.addEventListener('input', scheduleSave);
  authorInput.addEventListener('input', scheduleSave);
  exportBtn.disabled = true;

  renderList();

})();
</script>
</body>
</html>
